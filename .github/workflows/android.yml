name: Build Android APK
on:
  push:
    branches: [ android-messaround ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libffi-dev \
            libssl-dev \
            libtinfo6 \
            libncurses5-dev \
            libncursesw5-dev \
            zlib1g-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            ccache \
            libtool-bin \
            m4
      

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython==0.29.36" buildozer
      
      - name: Download NDK 25b
        run: |
          mkdir -p ~/.buildozer/android/platform
          cd ~/.buildozer/android/platform
          if [ ! -d "android-ndk-r25b" ]; then
            echo "Downloading NDK 25b..."
            wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
            unzip -q android-ndk-r25b-linux.zip
            rm android-ndk-r25b-linux.zip
          fi
      
      - name: Set Android Environment Variables
        run: |
          echo "ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$HOME/.buildozer/android/platform/android-ndk-r25b" >> $GITHUB_ENV
          echo "ANDROID_NDK=$HOME/.buildozer/android/platform/android-ndk-r25b" >> $GITHUB_ENV
      
      - name: Verify Buildozer Config
        run: |
          ls -la buildozer.spec
          ls -la assets/imgs/icons/icon.png
      
      - name: Clone and Patch python-for-android (skip libffi autogen)
        run: |
          # Clone p4a ourselves so we control the source before buildozer touches it
          git clone --depth 1 https://github.com/kivy/python-for-android.git /home/runner/p4a-patched
          
          RECIPE_FILE="/home/runner/p4a-patched/pythonforandroid/recipes/libffi/__init__.py"
          
          if [ -f "$RECIPE_FILE" ]; then
            # Comment out the autogen.sh call so it uses the pre-shipped configure script
            sed -i "s/shprint(sh.Command('.\/autogen.sh'), _env=env)/pass  # PATCHED: skip autogen.sh, use pre-generated configure/" "$RECIPE_FILE"
            grep -n "autogen\|PATCHED" "$RECIPE_FILE" || true
            echo "✅ Patched $RECIPE_FILE"
          else
            echo "❌ Could not find $RECIPE_FILE"
            exit 1
          fi
          
          # p4a needs to be pip-installed in editable mode from our patched clone too,
          # since buildozer calls it as a library, not just via the source_dir recipes
          pip install -e /home/runner/p4a-patched
      
      - name: Clean Previous Builds
        run: |
          rm -rf .buildozer
          rm -rf bin/
      
      - name: Build APK with Buildozer
        timeout-minutes: 60
        run: |
          # Automatically accept SDK/NDK licenses in non-interactive CI
          yes | buildozer -v android debug
      
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: roboquix-1.4.1-debug-apk
          path: bin/*.apk
      
      - name: Upload Build Logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            .buildozer/android/platform/build-*/build/logs/
            .buildozer/android/platform/build-*/build/other_builds/
