name: Build Android APK
on:
  push:
    branches: [ android-messaround ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libffi-dev \
            libssl-dev \
            libtinfo6 \
            libncurses5-dev \
            libncursesw5-dev \
            zlib1g-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            ccache \
            libtool-bin \
            m4
      

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython==0.29.36" buildozer
      
      - name: Download NDK 25b
        run: |
          mkdir -p ~/.buildozer/android/platform
          cd ~/.buildozer/android/platform
          if [ ! -d "android-ndk-r25b" ]; then
            echo "Downloading NDK 25b..."
            wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
            unzip -q android-ndk-r25b-linux.zip
            rm android-ndk-r25b-linux.zip
          fi
      
      - name: Set Android Environment Variables
        run: |
          echo "ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$HOME/.buildozer/android/platform/android-ndk-r25b" >> $GITHUB_ENV
          echo "ANDROID_NDK=$HOME/.buildozer/android/platform/android-ndk-r25b" >> $GITHUB_ENV
      
      - name: Verify Buildozer Config
        run: |
          ls -la buildozer.spec
          ls -la assets/imgs/icons/icon.png
      
      - name: Syntax Check
        run: |
          python3 -m py_compile main.py
          python3 -c "import pygame; print('Pygame import OK')" || echo "Warning: pygame not yet installed, will be built with APK"
      
      - name: Clean Previous Builds
        run: |
          rm -rf .buildozer
          rm -rf bin/
      
      - name: Build APK with Buildozer
        timeout-minutes: 60
        run: |
          # Automatically accept SDK/NDK licenses in non-interactive CI
          yes | buildozer -v android debug
      
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: roboquix-1.4.1-debug-apk
          path: bin/*.apk
      
      - name: Upload Build Logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            .buildozer/android/platform/build-*/build/logs/
            .buildozer/android/platform/build-*/build/other_builds/
