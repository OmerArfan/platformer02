name: Build Android APK
on:
  push:
    branches: [ android-messaround ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libffi-dev \
            libssl-dev \
            libtinfo6 \
            libncurses5-dev \
            libncursesw5-dev \
            zlib1g-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            ccache \
            libtool-bin \
            m4
      

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython==0.29.36" buildozer
      
      - name: Download NDK 25b
        run: |
          mkdir -p ~/.buildozer/android/platform
          cd ~/.buildozer/android/platform
          if [ ! -d "android-ndk-r25b" ]; then
            echo "Downloading NDK 25b..."
            wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
            unzip -q android-ndk-r25b-linux.zip
            rm android-ndk-r25b-linux.zip
          fi
      
      - name: Set Android Environment Variables
        run: |
          echo "ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$HOME/.buildozer/android/platform/android-ndk-r25b" >> $GITHUB_ENV
          echo "ANDROID_NDK=$HOME/.buildozer/android/platform/android-ndk-r25b" >> $GITHUB_ENV
          # Force libffi to skip autogen.sh and use pre-generated configure
          echo "LIBFFI_SKIP_AUTOGEN=1" >> $GITHUB_ENV
          echo "AUTOGEN_CONFIGURE_ARGS=--disable-shared" >> $GITHUB_ENV
      
      - name: Verify Buildozer Config
        run: |
          ls -la buildozer.spec
          ls -la assets/imgs/icons/icon.png
      
      - name: Patch p4a libffi Recipe to Skip Autogen
        run: |
          cat > /tmp/patch_p4a_libffi.py << 'PATCH_EOF'
          import os
          import sys
          
          # Find p4a's libffi recipe
          p4a_libffi = os.path.expanduser("~/.local/lib/python3.11/site-packages/pythonforandroid/recipes/libffi/__init__.py")
          
          if not os.path.exists(p4a_libffi):
              # Try alternate location
              p4a_libffi = os.path.expanduser("~/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/libffi/__init__.py")
          
          if os.path.exists(p4a_libffi):
              with open(p4a_libffi, 'r') as f:
                  content = f.read()
              
              # Replace the autogen.sh call with a no-op that just checks configure exists
              patched = content.replace(
                  "shprint(sh.Command('./autogen.sh'), _env=env)",
                  "# PATCHED: skip autogen.sh - use pre-generated configure\n                  # shprint(sh.Command('./autogen.sh'), _env=env)\n                  pass"
              )
              
              with open(p4a_libffi, 'w') as f:
                  f.write(patched)
              
              print(f"✅ Patched {p4a_libffi}")
          else:
              print(f"⚠️  Could not find p4a libffi recipe at {p4a_libffi}")
              sys.exit(1)
          PATCH_EOF
          
          python3 /tmp/patch_p4a_libffi.py
      - name: Clean Previous Builds
        run: |
          rm -rf .buildozer
          rm -rf bin/
      
      - name: Build APK with Buildozer
        timeout-minutes: 60
        run: |
          # Automatically accept SDK/NDK licenses in non-interactive CI
          yes | buildozer -v android debug
      
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: roboquix-1.4.1-debug-apk
          path: bin/*.apk
      
      - name: Upload Build Logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            .buildozer/android/platform/build-*/build/logs/
            .buildozer/android/platform/build-*/build/other_builds/
